<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocked by Kairos Shield</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #11141c; color: #f4f5f7; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
      main { max-width: 460px; padding: 32px; text-align: center; }
      .group { display: inline-block; padding: 3px 12px; border-radius: 999px; font-size: 13px; background: #2a2f3c; margin-bottom: 20px; }
      h1 { font-size: 24px; font-weight: 600; margin: 0 0 6px; }
      .site { color: #b6bac6; margin: 0 0 24px; word-break: break-all; }
      .task { font-size: 18px; margin: 0; }
      .time { font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums; margin: 4px 0 24px; min-height: 60px; }
      button { font: inherit; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; margin: 4px; }
      .primary { background: #4f7cff; color: #fff; }
      .quiet { background: #2a2f3c; color: #dfe2ea; }
      button:disabled { opacity: 0.5; cursor: default; }
      form { margin-top: 16px; }
      input { font: inherit; width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
        border: 1px solid #3a4050; background: #1b1f29; color: #f4f5f7; margin-bottom: 8px; }
      .note { font-size: 13px; color: #f0a35e; min-height: 18px; margin-top: 10px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <div class="group" id="group" hidden></div>
      <h1>Blocked while you focus</h1>
      <p class="site" id="site"></p>
      <p class="task" id="task"></p>
      <div class="time" id="time"></div>
      <div>
        <button class="primary" id="back">Back to task</button>
        <button class="quiet" id="allow">Allow 5 min</button>
      </div>
      <form id="form" hidden>
        <input id="reason" type="text" maxlength="200" placeholder="Why do you need this site?" aria-label="Reason" />
        <button class="quiet" type="submit" id="submit">Allow for 5 minutes</button>
      </form>
      <div class="note" id="note" aria-live="polite"></div>
    </main>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
